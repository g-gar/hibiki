plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    implementation project(':core:orchestrator')
    implementation project(':core:shared')
    implementation project(':features:metadata:metadata-api')
    implementation project(':features:ingestion:ingestion-api')
    implementation project(':core:identity:identity-api')
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.2.0'

    implementation "org.mapstruct:mapstruct:${rootProject.ext.versions.mapstruct}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.versions.mapstruct}"
    compileOnly "org.projectlombok:lombok:${rootProject.ext.versions.lombok}"
    annotationProcessor "org.projectlombok:lombok:${rootProject.ext.versions.lombok}"
}
