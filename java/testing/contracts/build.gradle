plugins {
    id 'java-library'
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.3')

    api 'org.junit.jupiter:junit-jupiter-api'
    api 'org.junit.jupiter:junit-jupiter-params'

    api 'io.projectreactor:reactor-test'

    api 'org.assertj:assertj-core:3.26.3'

    api project(':core:shared')
    api project(':core:catalog:catalog-api')
    api project(':core:identity:identity-api')
    api project(':core:orchestrator')
    api project(':features:devices:devices-api')
    api project(':features:library:library-api')
    api project(':features:ingestion:ingestion-api')
    api project(':features:search:search-api')
    api project(':features:entitlements:entitlements-api')
}
