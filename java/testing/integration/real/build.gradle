plugins {
    id 'java'
    id 'org.springframework.boot'

}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:2.0.3"
    }
}

dependencies {

    testImplementation project(':core:identity:identity-api')
    testImplementation project(':core:identity:identity-impl')
    testImplementation project(':core:catalog:catalog-api')
    testImplementation project(':core:catalog:catalog-impl')
    testImplementation project(':core:orchestrator')
    testImplementation project(':core:shared')
    testImplementation project(':features:ingestion:ingestion-api')
    testImplementation project(':features:ingestion:ingestion-impl')
    testImplementation project(':features:library:library-api')
    testImplementation project(':features:library:library-impl')
    testImplementation project(':features:metadata:metadata-api')
    testImplementation project(':features:metadata:metadata-impl')
    testImplementation project(':features:search:search-api')
    testImplementation project(':features:search:search-impl')
    testImplementation project(':features:devices:devices-api')
    testImplementation project(':features:devices:devices-impl')
    testImplementation project(':features:entitlements:entitlements-api')
    testImplementation project(':features:entitlements:entitlements-impl')
    testImplementation project(':packages:jwt')
    testImplementation project(':packages:uuid')

    testImplementation project(':testing:contracts')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-webclient'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation 'org.springframework.data:spring-data-neo4j'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-test-autoconfigure'

    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-neo4j'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}
